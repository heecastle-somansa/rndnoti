# ※ 테스트·샘플 미리보기 전용 고정 사본입니다. 운영 설정은 저장소 맨 위 config/ 폴더에서 고치세요.
# 발주처 그룹 설정 (개발요청서 3.2)
# - groups의 순서가 곧 메일 섹션 순서입니다.
# - aliases: 통합포털(IRIS·NTIS·기업마당) 공고의 공고기관명에 이 글자가 들어 있으면 그 그룹으로 배정합니다.
# - 맞는 그룹이 없으면 fallback_group(기타 기관)에 들어갑니다.

group_by: agency            # agency(기관별, 기본) | ministry(소관 부처별)
portal_group: 통합포털       # sources.yaml에서 group이 이 값이면 공고기관명으로 재분류
fallback_group: 기타 기관

# ───────────── 공고 카테고리 (메일의 가장 큰 구획. 위에서부터 순서대로 표시) ─────────────
# - 각 출처의 기본 카테고리는 sources.yaml의 category에 적습니다.
# - title_keywords: 공고명에 이 단어가 있으면 출처의 기본값과 상관없이 이 카테고리로 옮깁니다.
#   (위에 있는 카테고리가 먼저 적용됩니다. 예: "기술개발 지원사업" → R&D)
# - fixed: true            → 이 카테고리 출처의 공고는 다른 카테고리로 옮기지 않습니다.
# - dedupe_by_title: true  → 기관이 달라도 공고명이 같으면 한 번만 보여줍니다(나라장터와 기관 게시판에 함께 올라오는 입찰).
categories:
  - name: R&D
    label: 부처별 R&D 공고
    title_keywords: [R&D, 연구개발, 기술개발, 신규과제, 과제공모, 수요조사]
  - name: 입찰
    label: 나라장터·기관 입찰 공고
    fixed: true
    dedupe_by_title: true
    title_keywords: [입찰, 사전규격, 제안요청]
  - name: 바우처
    label: 바우처·지원사업 공고
    title_keywords: [바우처, 지원사업, 수요기업, 참여기업, 공급기업, 활용지원, 이용지원, 인증, 지식재산,
                     해외진출, 수출, 전시회, 판로]

groups:
  - name: 나라장터
    ministry: 나라장터
    aliases: []
  - name: 과학기술정보통신부
    ministry: 과학기술정보통신부
    aliases: [과학기술정보통신부, 과기정통부]
  - name: IITP
    ministry: 과학기술정보통신부
    aliases: [IITP, 정보통신기획평가원]
  - name: NIPA
    ministry: 과학기술정보통신부
    aliases: [NIPA, 정보통신산업진흥원]
  - name: GPU추진단
    ministry: 과학기술정보통신부
    aliases: []
  - name: NIA
    ministry: 과학기술정보통신부
    aliases: [NIA, 한국지능정보사회진흥원, 한국정보화진흥원]
  - name: KISA
    ministry: 과학기술정보통신부
    aliases: [KISA, 한국인터넷진흥원]
  - name: KISIA
    ministry: 과학기술정보통신부
    aliases: [KISIA, 한국정보보호산업협회]
  - name: ETRI
    ministry: 과학기술정보통신부
    aliases: [ETRI, 한국전자통신연구원]
  - name: KEIT
    ministry: 산업통상부
    aliases: [KEIT, 한국산업기술기획평가원, 한국산업기술평가관리원]
  - name: 중소벤처기업부
    ministry: 중소벤처기업부
    aliases: [중소벤처기업부, 중기부, 중소기업기술정보진흥원]
  - name: 수출지원
    ministry: 중소벤처기업부
    aliases: []
  - name: SBA
    ministry: 서울특별시
    aliases: [SBA, 서울경제진흥원, 서울산업진흥원]
  - name: KLID
    ministry: 행정안전부
    aliases: [KLID, 한국지역정보개발원]
  - name: 기타 기관
    ministry: 기타
    aliases: []
