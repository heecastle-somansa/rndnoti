{% set F %}font-family:'맑은 고딕','Malgun Gothic',Arial,sans-serif;{% endset %}
<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>{{ subject }}</title></head>
<body style="margin:0; padding:0; background-color:#ffffff;" bgcolor="#ffffff">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" style="padding:20px 8px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:640px; width:100%; border:1px solid #fecdca;">
  <tr><td bgcolor="#fef3f2" style="background-color:#fef3f2; padding:16px 20px; {{ F }} font-size:17px; font-weight:bold; color:#b42318;">{{ title }}</td></tr>
  {% for line in lines %}
  <tr><td style="padding:4px 20px; {{ F }} font-size:13px; line-height:20px; color:#344054;">{{ line }}</td></tr>
  {% endfor %}
  <tr><td style="padding:12px 20px 16px 20px; {{ F }} font-size:12px; color:#667085;">{% if footer %}{{ footer }}{% else %}GitHub 저장소 → Actions 탭에서 실행 기록을 확인하세요. 실행 상태(state/)는 바뀌지 않아 다음 실행에서 같은 기간을 다시 수집합니다.{% endif %}</td></tr>
</table>
</td></tr></table>
</body>
</html>
