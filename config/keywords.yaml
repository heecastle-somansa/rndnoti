# 분류·키워드 설정 (개발요청서 6장)
# - 키워드는 공백 없이 적습니다. "망 분리"처럼 띄어 쓴 공고명도 자동으로 매칭됩니다.
# - 영문 대소문자는 구분하지 않습니다 (vdi = VDI).
# - 영문 키워드(EDR, APT 등)는 단어 단위로만 찾습니다. 'BEDRock' 안의 'edr'은 매칭되지 않습니다.
# - require: 적어 두면 키워드에 더해 이 단어 중 하나도 공고명에 있어야 매칭합니다 (예: 수출 + ICT).
# - 이 파일만 고치면 다음 실행부터 반영됩니다.
# - only_in: 적어 두면 그 공고 카테고리(R&D | 입찰 | 바우처)의 공고에만 이 분류를 적용합니다.
#   (없으면 모든 카테고리에 적용)

# 공통 제외 키워드: 이 단어가 공고명에 있으면 모든 분류에서 제외
exclude:
  [경비, 시설경비, 보안요원, 경호, 방범, 보안등, 보안필름, 파쇄, 보안검색, 소방]

categories:
  망분리·VDI:
    keywords: [망분리, 논리적망분리, 인터넷망분리, 망분리개선, 가상PC, 가상데스크톱, VDI,
               클라우드PC, DaaS, 망연계, 자료전송, 국가망보안체계, N2SF]
    # 검토 2026-11-12: '자료전송'은 아직 오탐 없음. 늘어나면 '망간자료전송'으로 좁힐 것

  클라우드·가상화:
    keywords: [클라우드전환, 클라우드네이티브, 프라이빗클라우드, 클라우드인프라, 서버가상화,
               가상화, HCI, 하이퍼바이저, 컨테이너플랫폼, 컨테이너기반, 쿠버네티스, IaaS, PaaS]
    exclude: [가상화설계]     # 검토: '컨테이너'는 항만·화물 컨테이너가 대부분이라 플랫폼 표현으로 좁힘

  DLP·정보유출:
    keywords: [DLP, 정보유출방지, 내부정보유출, 개인정보, 개인정보유출방지, 개인정보검출, 개인정보 필터링,
               매체제어, 출력물보안, 문서보안, 생성형AI보안, AI보안]
    exclude: [CCTV, 영상감시, 출입통제, 시설보안, 영향평가, DLP모니터]   # 이 분류에서만 제외
    # 검토: 개인정보영향평가(컨설팅 용역)와 DLP모니터(디스플레이 장비)는 제품 도입 공고가 아니라 제외

  엔드포인트:
    keywords: [EDR, XDR, 엔드포인트, 단말보안, PC보안, 백신SW, 백신프로그램, 백신솔루션, 백신라이선스,
               안티바이러스, 악성코드, 랜섬웨어, APT, 위협, 인텔리전스]
    exclude: [CCTV, 영상감시, 출입통제, 시설보안]
    # 검토: '백신' 단독은 예방접종·동물백신 공고가 대부분(10건 중 8건)이라 SW 표현으로 좁힘

  보안 일반:
    keywords: [정보보호, 정보보안, 사이버보안, 보안솔루션, 보안시스템, 보안고도화, 보안강화,
               제로트러스트, 기밀컴퓨팅]
    exclude: [CCTV, 영상감시, 출입통제, 시설보안, 교복, 고등학교, 사이버보안과]
    # 검토: 사이버보안고등학교 교복, 대학 사이버보안과 비품 구매가 걸려 제외

  생체인증·출입보안:
    keywords: [생체인증, 생체인식, 바이오인식, 생체정보, 지문인식, 안면인식, 얼굴인식, 홍채인식,
               정맥인식, 출입통제, 출입관리, 출입보안, 스마트출입, 모바일출입증, 근태관리,
               모바일신분증, 디지털신분증, 신원확인, 본인확인, 비대면인증, FIDO, 영상분석]

  # ───── 아래 3개는 '바우처·지원사업' 카테고리 공고에만 적용되는 분류입니다 ─────
  # 보안 주제와 무관하게, 회사가 받을 수 있는 혜택형 공고를 고릅니다.
  바우처·인프라 지원:
    only_in: [바우처]
    keywords: [바우처, GPU, 고성능컴퓨팅, AI컴퓨팅, 클라우드이용, 클라우드서비스이용, 데이터활용,
               실증, 테스트베드, 시범구매, 혁신제품]
    exclude: [에너지바우처, 소상공인, 농업, 수산, 축산]

  인증·지식재산 지원:
    only_in: [바우처]
    keywords: [지식재산, 특허, IP나래, IP바우처, 인증취득, 인증획득, 인증지원, GS인증, CC인증,
               해외규격인증, 성능평가, 기술보호]
    exclude: [농업, 수산, 축산, 식품, 뷰티]

  판로·해외진출 지원:
    only_in: [바우처]
    keywords: [해외진출, 수출, 전시회, 박람회, 판로, 공급기업, 수요기업, 마케팅지원]
    require: [ICT, SW, 소프트웨어, 정보보호, 정보보안, 보안, AI, 인공지능, 디지털, IT, 클라우드, 데이터, 스타트업, 벤처]
    # 검토: 농수산물 수출·뷰티/식품 전시회가 대부분이라 IT·보안 관련 단어가 함께 있을 때만 매칭

