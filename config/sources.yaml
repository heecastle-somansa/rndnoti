    page_param: pageIndex
    link_regex: "doBbsFView\\('(\\d+)','(\\d+)','\\d+','(\\d+)'\\)"
    link_template: "https://www.nia.or.kr/site/nia_kor/ex/bbs/View.do?cbIdx={1}&bcIdx={2}&parentSeq={3}"
    title_remove: ["\\(새 글\\)", "-?첨부파일 있음"]

