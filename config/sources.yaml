# 수집 출처 목록 (개발요청서 3.1, 7.2)
#
# 자주 바꾸는 항목
#   enabled      : false로 바꾸면 그 출처는 수집하지 않습니다 (출처 점검 모드에서는 계속 점검합니다)
#   url          : 목록 화면 주소
#   title_filter : 제목에 이 단어 중 하나가 있을 때만 수집 (비어 있으면 전체)
#   group        : config/groups.yaml의 그룹 이름. "통합포털"이면 공고기관명으로 자동 재분류
#
# type: api_g2b_bid | api_g2b_prespec | generic_board | custom:<이름>
# generic_board의 selectors/options 설명은 src/rnd_noti/sources/generic_board.py 맨 위에 있습니다.
# note: 사람이 읽는 메모 (출처 점검 결과에 함께 표시)
#
# 마지막 점검: 2026-11-11 (한국 IP에서 확인. 해외 IP인 GitHub Actions에서의 결과는 출처 점검 모드로 확인)

# ───────────── 나라장터 (공공데이터포털 API) ─────────────
# options.operations = 조회할 업무구분 (용역 | 물품 | 공사 | 외자)
# options.base_url  = API 주소가 바뀌었을 때만 적습니다 (비우면 기본 주소)
- id: g2b_bid
  name: 나라장터 입찰공고
  group: 나라장터
  ministry: 나라장터
  enabled: true
  type: api_g2b_bid
  url: https://www.g2b.go.kr/
  notice_type: 본공고
  options: {operations: [용역, 물품]}

- id: g2b_prespec
  name: 나라장터 사전규격
  group: 나라장터
  ministry: 나라장터
  enabled: true
  type: api_g2b_prespec
  url: https://www.g2b.go.kr/
  notice_type: 사전규격/수요조사
  options: {operations: [용역, 물품]}

# ───────────── 통합포털 (공고기관명으로 재분류) ─────────────
- id: iris
  name: IRIS 통합 사업공고
  group: 통합포털
  enabled: true
  type: custom:iris
  url: https://www.iris.go.kr/contents/retrieveBsnsAncmBtinSituListView.do
  notice_type: 본공고

- id: ntis
  name: NTIS R&D공고
  group: 통합포털
  enabled: false
  type: generic_board
  url: http://www.ntis.go.kr/rndgate/eg/un/ra/mng.do
  notice_type: 본공고
  note: "robots.txt가 모든 자동 수집을 금지(Disallow: /). 수집하지 않음. IRIS·기업마당으로 대부분 대체"

- id: bizinfo
  name: 기업마당 지원사업조회
  group: 통합포털
  enabled: true
  type: generic_board
  url: https://www.bizinfo.go.kr/see/seea/selectSEEA100.do
  notice_type: 본공고
  selectors:
    row: "table tbody tr:has(td.txt_l)"
    title: "td.txt_l a"
    link: "td.txt_l a@href"
    date: "td:nth-of-type(7)"
    deadline: "td:nth-of-type(4)"
    org: "td:nth-of-type(5)"
  options: {page_param: cpage, max_pages: 30, id_params: [pblancId]}

