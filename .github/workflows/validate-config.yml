# 설정 파일을 고치면 바로 형식 검사를 합니다 (메일 발송·사이트 접속 없음, 1분 이내).
#  - 초록 체크(✓): 다음 월요일 실행에 그대로 반영됩니다.
#  - 빨간 X(✗)  : Actions 탭에서 이 실행을 눌러 "설정 파일 오류" 문구를 확인하고 고치세요.
name: Validate config

on:
  push:
    paths: ["config/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate config
        env:
          PYTHONPATH: src
        run: python -m rnd_noti.main --mode validate
